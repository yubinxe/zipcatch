# 동네 공간 자산 보강 — 새 공고 자리에 필요한 z15 타일을 만들어 PR 로 올린다(main 에 바로 넣지 않는다).
#
# 운영 정책
#  - 매일 11:10 KST(좌표 보강 루틴 10시대 KST 실행 뒤)에 한 번, 그리고 필요하면 손으로. 운영 공개 API 의 공고 좌표를 보고
#    아직 없는 타일만 만든다(있는 타일은 건드리지 않는다). 새 타일이 없으면 아무것도 하지 않는다.
#  - 원천 빌드 날짜는 매니페스트의 build 를 그대로 쓴다 — 한 버전(v1) 안의 타일이 같은 원천 시점이 되게.
#    원천을 새 날짜로 바꾸려면 버전을 올려(--version v2) 전부 다시 만든다.
#  - 결과는 PR. 사람이 보고 병합하면 Vercel Git 배포가 한 번 돈다. main 에 바로 쓰지 않는다.
#  - 공개 Overpass 를 부르지 않는다. 방문자 요청은 언제나 정적 자산만 읽는다.
#  - 빈 자리는 /api/notices/coverage 의 neighborhoodAssets.partial·none 으로 보인다.
name: spatial-tiles
on:
  schedule:
    - cron: '10 2 * * *'
  workflow_dispatch:
    inputs:
      build:
        description: 'Protomaps 빌드 날짜(YYYYMMDD) — 비우면 매니페스트의 build'
        required: false
permissions:
  contents: write
  pull-requests: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pmtiles mapbox-vector-tile shapely requests
      - name: build tiles
        run: |
          B="${{ github.event.inputs.build }}"
          [ -z "$B" ] && B=$(python -c "import json;print(json.load(open('public/spatial/v1/manifest.json'))['build'])")
          python scripts/spatial/build_tiles.py --build "$B"
          echo "BUILD=$B" >> "$GITHUB_ENV"
      - name: open PR
        env:
          # 저장소 설정에서 Actions 의 PR 생성이 막혀 있으면(Settings > Actions > General > Workflow permissions
          # > 'Allow GitHub Actions to create and approve pull requests') 기본 토큰으로는 PR 을 못 만든다.
          # 그때는 PR 권한이 있는 토큰을 SPATIAL_PR_TOKEN 비밀값으로 두면 그것을 쓴다(없으면 기본 토큰).
          GH_TOKEN: ${{ secrets.SPATIAL_PR_TOKEN || github.token }}
        run: |
          # 생성 시각만 바뀐 매니페스트는 변경으로 치지 않는다
          if [ -z "$(git status --porcelain public/spatial/v1/15)" ]; then echo "새 타일 없음"; exit 0; fi
          BR="spatial/tiles-$BUILD-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add public/spatial
          git commit -m "spatial: 동네 공간 자산 보강 (Protomaps $BUILD)"
          git push -u origin "$BR"
          if ! OUT=$(gh pr create --title "spatial: 동네 공간 자산 보강 ($BUILD)" --body "scripts/spatial/build_tiles.py 로 새 공고 자리의 z15 타일을 만들었습니다. 원천 Protomaps Basemap $BUILD (OpenStreetMap, ODbL)." --base main --head "$BR" 2>&1); then
            # 타일은 이미 브랜치에 올라갔다 — 일을 잃지 않게, 사람이 바로 PR 을 열 수 있는 주소와 원인을 남긴다
            URL="https://github.com/${{ github.repository }}/compare/main...$BR?expand=1"
            {
              echo "### 타일은 만들었지만 PR 을 열지 못했습니다"
              echo ""
              echo "- 브랜치: \`$BR\`"
              echo "- 바로 열기: $URL"
              echo "- 원인: \`$OUT\`"
              echo "- 해결: Settings > Actions > General > Workflow permissions 에서 'Allow GitHub Actions to create and approve pull requests' 를 켜거나, PR 권한 토큰을 SPATIAL_PR_TOKEN 비밀값으로 등록"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=PR 생성 실패::타일은 $BR 에 푸시됨. $URL 에서 PR 을 여세요. 원인: $OUT"
            exit 1
          fi
          echo "$OUT"
